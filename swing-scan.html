// ── INDIKATOREN ──────────────────────────────────────────────────────────────
async function fetchYahoo(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1y&interval=1d`;
  const proxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`;
  const res = await fetch(proxy);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const r = data?.chart?.result?.[0];
  if (!r) throw new Error("Keine Daten");
  const q = r.indicators.quote[0];
  return { closes:q.close, volumes:q.volume, highs:q.high, lows:q.low };
}

const cl = arr => arr.map(v=>(v==null||isNaN(v))?null:v);

function ma(arr,p) {
  const v = arr.filter(x=>x!=null);
  if(v.length<p) return null;
  const s = v.slice(-p);
  return s.reduce((a,b)=>a+b,0)/p;
}

function atr(highs,lows,closes,p=14) {
  const trs=[];
  for(let i=1;i<highs.length;i++){
    if(highs[i]==null||lows[i]==null||closes[i-1]==null) continue;
    trs.push(Math.max(highs[i]-lows[i],Math.abs(highs[i]-closes[i-1]),Math.abs(lows[i]-closes[i-1])));
  }
  if(trs.length<p) return null;
  return trs.slice(-p).reduce((a,b)=>a+b,0)/p;
}

function analyze(ticker,name,idx,closes,volumes,highs,lows,settings) {
  closes=cl(closes);volumes=cl(volumes);highs=cl(highs);lows=cl(lows);
  const last=closes.filter(v=>v!=null).slice(-1)[0];
  if(!last||last<10) return null;
  const ma50=ma(closes,50), ma200=ma(closes,200);
  const atrVal=atr(highs,lows,closes);
  if(!ma50||!atrVal) return null;
  const atrPct=(atrVal/last)*100;
  if(atrPct>5) return null;
  const ma50b=ma(closes.slice(0,-5),50);
  const ma50Rising=ma50b?ma50>ma50b:false;
  const overMA50=last>ma50;
  if(!overMA50||!ma50Rising) return null;
  const distPct=((last-ma50)/ma50)*100;
  if(distPct>20) return null;
  const rH=highs.filter(v=>v!=null).slice(-20), pH=highs.filter(v=>v!=null).slice(-40,-20);
  const rL=lows.filter(v=>v!=null).slice(-20),  pL=lows.filter(v=>v!=null).slice(-40,-20);
  const higherHighs=rH.length&&pH.length?Math.max(...rH)>Math.max(...pH):false;
  const higherLows =rL.length&&pL.length?Math.min(...rL)>Math.min(...pL):false;
  if(!higherHighs) return null;
  let score=0;
  if(overMA50) score+=2;
  if(ma200&&last>ma200) score+=2;
  if(ma50Rising) score+=2;
  if(higherHighs) score+=1;
  if(higherLows)  score+=1;
  const vols=volumes.filter(v=>v!=null);
  const avgVol=vols.slice(-20).reduce((a,b)=>a+b,0)/20;
  const lastVol=vols.slice(-1)[0];
  const volR=avgVol>0?lastVol/avgVol:0;
  if(volR>1.2) score+=1;
  const stop=ma50*0.98;
  const riskPS=last-stop;
  const maxRisk=settings.depot*(settings.riskPct/100);
  const maxPos=settings.depot*0.2;
  let shares=Math.floor(maxRisk/riskPS);
  let inv=shares*last;
  if(inv>maxPos){shares=Math.floor(maxPos/last);inv=shares*last;}
  const risk=shares*riskPS;
  const target=last+riskPS*2.5;
  const crv=riskPS>0?(target-last)/riskPS:0;
  return {
    ticker,name,idx,last:last.toFixed(2),
    ma50:ma50.toFixed(2),ma200:ma200?ma200.toFixed(2):"n/a",
    atrPct:atrPct.toFixed(1),score,
    overMA50,overMA200:ma200?last>ma200:null,
    ma50Rising,higherHighs,higherLows,
    volR:volR.toFixed(2),
    stop:stop.toFixed(2),target:target.toFixed(2),
    crv:crv.toFixed(1),shares,inv:inv.toFixed(0),
    risk:risk.toFixed(0),distPct:distPct.toFixed(1),
  };
}

// ── MARKTFILTER ───────────────────────────────────────────────────────────────
async function checkMarkt() {
  const indices = [
    {t:"^GSPC", n:"S&P 500"},
    {t:"^GDAXI", n:"DAX"},
  ];
  const results = [];
  for(const idx of indices) {
    try {
      const {closes} = await fetchYahoo(idx.t);
      const c = cl(closes);
      const last = c.filter(v=>v!=null).slice(-1)[0];
      const ma50val = ma(c, 50);
      const ueberMA50 = last && ma50val ? last > ma50val : null;
      const abstand = last && ma50val ? ((last - ma50val) / ma50val * 100).toFixed(1) : null;
      results.push({name: idx.n, last: last?.toFixed(0), ma50: ma50val?.toFixed(0), ueberMA50, abstand});
    } catch(e) {
      results.push({name: idx.n, fehler: true});
    }
  }
  return results;
}

async function newsCheck(ticker,name) {
  const prompt=`Du bist Trading-Assistent. Prüfe "${name}" (${ticker}) auf Ausschlussgründe für einen Swing-Trade (2–12 Wochen). Quartalszahlen <20 Tage? Gewinnwarnung? Skandal? FED/EZB/CPI heute? Antworte NUR als JSON: {"empfehlung":"KAUFEN"|"WARTEN"|"AUSSCHLIESSEN","hauptgrund":"Ein Satz","ausschlussgrund":null,"quartalszahlen":false,"katalysator":null}`;
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:400,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      messages:[{role:"user",content:prompt}]})
  });
  const data=await res.json();
  const txt=data.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"";
  const m=txt.replace(/```json|```/g,"").match(/\{[\s\S]*\}/);
  if(!m) throw new Error("Kein JSON");
  return JSON.parse(m[0]);
}

// ── SCANNER TAB ───────────────────────────────────────────────────────────────
function ScannerTab({settings}) {
  const [mode,setMode]=useState(null);
  const [status,setStatus]=useState("idle");
  const [progress,setProgress]=useState(0);
  const [curTicker,setCurTicker]=useState("");
  const [scanned,setScanned]=useState(0);
  const [candidates,setCandidates]=useState([]);
  const [errors,setErrors]=useState([]);
  const abortRef=useRef(false);

  async function runScan(uni) {
    abortRef.current=false;
    setStatus("running");setProgress(0);setCandidates([]);setErrors([]);
    const results=[],errs=[],total=uni.length;
    for(let i=0;i<total;i++){
      if(abortRef.current) break;
      const s=uni[i];
      setCurTicker(`${s.t} – ${s.n}`);setScanned(i+1);
      setProgress(Math.round(((i+1)/total)*100));
      try{
        const {closes,volumes,highs,lows}=await fetchYahoo(s.t);
        const r=analyze(s.t,s.n,s.idx,closes,volumes,highs,lows,settings);
        if(r) results.push(r);
      }catch(e){errs.push(`${s.t}: ${e.message}`);}
      await new Promise(r=>setTimeout(r,100));
    }
    results.sort((a,b)=>b.score-a.score);
    setCandidates(results.slice(0,3));setErrors(errs);setStatus("done");
  }

  const [markt, setMarkt] = useState(null);
  const [marktLoading, setMarktLoading] = useState(false);

  async function doMarktCheck() {
    setMarktLoading(true);
    const r = await checkMarkt();
    setMarkt(r);
    setMarktLoading(false);
  }

  const marktOk = markt ? markt.every(m => m.fehler || m.ueberMA50 !== false) : null;
  const marktKritisch = markt ? markt.some(m => !m.fehler && m.ueberMA50 === false) : false;

  const uni=mode==="schnell"?SCHNELL:VOLL;

  return (
    <div>
      {/* ── MARKTFILTER ── */}
      <div style={{...S.card, marginBottom:"10px", borderColor: marktKritisch ? C.red+"66" : markt && marktOk ? C.accent+"66" : C.border}}>
        <div style={S.secTitle}>Marktlage – Pflichtcheck</div>
        {!markt && (
          <button style={S.btn("primary", marktLoading)} onClick={doMarktCheck} disabled={marktLoading}>
            {marktLoading ? "⟳ Markt wird geprüft..." : "🌍 Markt prüfen"}
          </button>
        )}
        {markt && (
          <>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"8px", marginBottom:"10px"}}>
              {markt.map(m => (
                <div key={m.name} style={{background:C.surface, borderRadius:"6px", padding:"10px", border:`1px solid ${m.fehler ? C.border : m.ueberMA50 ? C.accent+"44" : C.red+"44"}`}}>
                  <div style={{fontSize:"10px", color:C.muted, fontFamily:C.mono, marginBottom:"4px"}}>{m.name}</div>
                  {m.fehler ? (
                    <div style={{fontSize:"11px", color:C.yellow}}>⚠ Keine Daten</div>
                  ) : (
                    <>
                      <div style={{fontFamily:C.mono, fontWeight:"700", fontSize:"13px", color: m.ueberMA50 ? C.accent : C.red}}>
                        {m.ueberMA50 ? "✓ ÜBER MA50" : "✗ UNTER MA50"}
                      </div>
                      <div style={{fontSize:"10px", color:C.muted, marginTop:"2px"}}>
                        Kurs: {m.last} · MA50: {m.ma50}
                      </div>
                      <div style={{fontSize:"10px", color: parseFloat(m.abstand) >= 0 ? C.accent : C.red}}>
                        {parseFloat(m.abstand) >= 0 ? "+" : ""}{m.abstand}% zum MA50
                      </div>
                    </>
                  )}
                </div>
              ))}
            </div>
            {marktKritisch && (
              <div style={{background:"#2a0a10", border:`1px solid ${C.red}44`, borderRadius:"8px", padding:"12px", marginBottom:"10px"}}>
                <div style={{fontFamily:C.mono, fontWeight:"700", color:C.red, fontSize:"13px", marginBottom:"4px"}}>
                  ⛔ MARKT UNGÜNSTIG – HEUTE KEIN TRADE
                </div>
                <div style={{fontSize:"11px", color:C.muted, lineHeight:"1.6"}}>
                  Mindestens ein Index liegt unter seinem MA50. Keine neuen Long-Positionen eingehen.
                </div>
              </div>
            )}
            {!marktKritisch && marktOk && (
              <div style={{background:"#0a2a1a", border:`1px solid ${C.accent}44`, borderRadius:"8px", padding:"10px", marginBottom:"10px"}}>
                <div style={{fontFamily:C.mono, fontWeight:"700", color:C.accent, fontSize:"13px"}}>
                  ✓ MARKT OK – Scan erlaubt
                </div>
              </div>
            )}
            <button style={{...S.btn("secondary"), marginBottom:"0"}} onClick={()=>setMarkt(null)}>↺ Neu prüfen</button>
          </>
        )}
      </div>

      {/* ── SCAN-BEREICH – nur wenn Markt OK ── */}
      {marktKritisch && (
        <div style={{...S.card, borderColor:C.red+"33"}}>
          <div style={{fontSize:"12px", color:C.muted, textAlign:"center", padding:"8px"}}>
            Scan gesperrt – Marktlage ungünstig.
          </div>
        </div>
      )}
      {(!markt || !marktKritisch) && (<>
        <div style={S.card}>
          <div style={S.secTitle}>Scan-Modus wählen</div>
          <div style={{fontSize:"12px",color:C.muted,marginBottom:"14px",lineHeight:"1.6"}}>
            Beide Modi nutzen echte Vortages-Schlusskurse von Yahoo Finance.
          </div>
          {[
            ["schnell","⚡ SCHNELL-SCAN",`DAX · MDAX · NASDAQ 100 · ${SCHNELL.length} Aktien · ca. 3 Min`,C.accent],
            ["voll","🔭 VOLL-SCAN",`+ S&P 500 · ${VOLL.length} Aktien · ca. 15 Min`,C.yellow],
          ].map(([id,title,sub,col])=>(
            <div key={id} style={{...S.card,borderColor:col+"55",cursor:"pointer",marginBottom:"10px"}} onClick={()=>setMode(id)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontFamily:C.mono,fontWeight:"700",color:col}}>{title}</div>
                  <div style={{fontSize:"11px",color:C.muted,marginTop:"3px"}}>{sub}</div>
                </div>
                <div style={{fontFamily:C.mono,fontSize:"22px",color:col}}>›</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {mode&&status==="idle"&&(
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
            <div>
              <div style={{fontFamily:C.mono,fontWeight:"700",color:mode==="schnell"?C.accent:C.yellow}}>
                {mode==="schnell"?"⚡ SCHNELL-SCAN":"🔭 VOLL-SCAN"}
              </div>
              <div style={{fontSize:"11px",color:C.muted}}>{uni.length} Aktien</div>
            </div>
            <button style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:"4px",padding:"4px 10px",cursor:"pointer",fontSize:"11px"}} onClick={()=>setMode(null)}>← Wechseln</button>
          </div>
          <button style={S.btn("primary")} onClick={()=>runScan(uni)}>▶ SCAN STARTEN</button>
        </div>
      )}

      {status==="running"&&(
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
            <span style={{fontSize:"12px",color:C.muted}}>Analysiere {scanned}/{uni.length}</span>
            <span style={{fontFamily:C.mono,fontSize:"12px",color:C.accent}}>{progress}%</span>
          </div>
          <div style={S.prog}><div style={S.bar(progress)}/></div>
          <div style={{fontFamily:C.mono,fontSize:"11px",color:C.muted,marginBottom:"10px"}}>{curTicker}</div>
          <button style={S.btn("secondary")} onClick={()=>{abortRef.current=true;setStatus("idle");}}>■ Abbrechen</button>
        </div>
      )}

      {status==="done"&&(
        <>
          <div style={{...S.card,borderColor:(candidates.length>0?C.accent:C.red)+"44"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontFamily:C.mono,fontWeight:"700",fontSize:"14px",color:candidates.length>0?C.accent:C.red}}>
                {candidates.length>0?`${candidates.length} KANDIDAT${candidates.length>1?"EN":""} GEFUNDEN`:"HEUTE KEIN TRADE"}
              </span>
              <button style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:"4px",padding:"4px 10px",cursor:"pointer",fontSize:"11px"}} onClick={()=>{setStatus("idle");setCandidates([]);}}>Neu</button>
            </div>
            {candidates.length===0&&<div style={{fontSize:"12px",color:C.muted,marginTop:"6px"}}>Kein Setup erfüllt heute alle Kriterien.</div>}
            <div style={{fontSize:"10px",color:C.muted,marginTop:"6px",fontFamily:C.mono}}>{uni.length} Aktien geprüft · {errors.length} Fehler</div>
          </div>
          {candidates.map(c=><Card key={c.ticker} c={c}/>)}
        </>
      )}

      <div style={{fontSize:"11px",color:C.muted,background:C.surface,borderRadius:"8px",padding:"10px",marginTop:"8px",lineHeight:"1.7"}}>
        📊 Daten: Yahoo Finance Vortages-Schlusskurse<br/>
        🔍 Filter: Stage 2, MA50↑, ATR&lt;5%, Kurs&gt;10€, max.20% über MA50<br/>
        ⚠ Keine Anlageberatung – eigene Entscheidung!
      </div>
      </>)}
    </div>
  );
}

// ── PRÜFEN TAB ────────────────────────────────────────────────────────────────
function CheckerTab({settings}) {
  const [ticker,setTicker]=useState("");
  const [result,setResult]=useState(null);
  const [error,setError]=useState(null);
  const [loading,setLoading]=useState(false);
  const [newsResult,setNewsResult]=useState(null);
  const [newsLoading,setNewsLoading]=useState(false);

  async function doCheck(){
    if(!ticker.trim()) return;
    setLoading(true);setResult(null);setError(null);setNewsResult(null);
    const t=ticker.trim().toUpperCase();
    try{
      const {closes,volumes,highs,lows}=await fetchYahoo(t);
      const r=analyze(t,t,"–",closes,volumes,highs,lows,settings);
      if(r){setResult(r);}
      else{
        const last=cl(closes).filter(v=>v!=null).slice(-1)[0];
        const m50=ma(cl(closes),50);
        const m200=ma(cl(closes),200);
        const atrVal=atr(cl(highs),cl(lows),cl(closes));
        const atrP=atrVal&&last?((atrVal/last)*100).toFixed(1):"n/a";
        setError({msg:"Aktie erfüllt die Kaufkriterien nicht.",last:last?.toFixed(2),ma50:m50?.toFixed(2),ma200:m200?.toFixed(2),atrPct:atrP});
      }
    }catch(e){setError({msg:`Fehler: ${e.message}`});}
    setLoading(false);
  }

  async function doNews(){
    setNewsLoading(true);
    try{setNewsResult(await newsCheck(ticker.trim().toUpperCase(),ticker.trim().toUpperCase()));}
    catch(e){setNewsResult({empfehlung:"FEHLER",hauptgrund:e.message});}
    setNewsLoading(false);
  }

  return (
    <div>
      <div style={S.card}>
        <div style={S.secTitle}>Einzelaktie prüfen</div>
        <input style={S.input} placeholder="Ticker (z.B. AAPL, SAP.DE)" value={ticker}
          onChange={e=>setTicker(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doCheck()}/>
        <button style={S.btn("primary",loading)} onClick={doCheck} disabled={loading}>
          {loading?"⟳ Laden...":"PRÜFEN"}
        </button>
      </div>
      {error&&(
        <div style={{...S.card,borderColor:C.red+"44"}}>
          <div style={{color:C.red,fontFamily:C.mono,fontSize:"12px",marginBottom:"8px"}}>✗ {error.msg}</div>
          {error.last&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
              {[["Kurs",`${error.last} €`],["MA50",`${error.ma50} €`],["MA200",`${error.ma200||"n/a"} €`],["ATR%",`${error.atrPct}%`]]
                .map(([l,v])=><div key={l}><div style={{fontSize:"9px",color:C.muted,fontFamily:C.mono}}>{l}</div><div style={{fontFamily:C.mono,fontSize:"13px"}}>{v}</div></div>)}
            </div>
          )}
        </div>
      )}
      {result&&<Card c={result}/>}
      {(result||error?.last)&&!newsResult&&(
        <button style={S.btn("secondary",newsLoading)} onClick={doNews} disabled={newsLoading}>
          {newsLoading?"⟳ KI-News-Check...":"🔍 KI News-Check"}
        </button>
      )}
      {newsResult&&(
        <div style={S.card}>
          <div style={S.secTitle}>KI News-Analyse</div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}>
            <span style={{fontSize:"12px"}}>{newsResult.hauptgrund}</span>
            <span style={S.chip(newsResult.empfehlung==="KAUFEN"?"green":newsResult.empfehlung==="AUSSCHLIESSEN"?"red":"yellow")}>{newsResult.empfehlung}</span>
          </div>
          {newsResult.ausschlussgrund&&<div style={{fontSize:"11px",color:C.red}}>⛔ {newsResult.ausschlussgrund}</div>}
          {newsResult.katalysator&&<div style={{fontSize:"11px",color:C.accent}}>🚀 {newsResult.katalysator}</div>}
        </div>
      )}
    </div>
  );
}

// ── EINSTELLUNGEN TAB ─────────────────────────────────────────────────────────
function SettingsTab({settings,setSettings}) {
  return (
    <div>
      <div style={S.card}>
        <div style={S.secTitle}>Depot & Risiko</div>
        <div style={{marginBottom:"14px"}}>
          <div style={S.label}>Depot-Gesamtkapital (€)</div>
          <input style={S.input} type="number" value={settings.depot}
            onChange={e=>setSettings(s=>({...s,depot:parseFloat(e.target.value)||5000}))}/>
        </div>
        <div style={{marginBottom:"14px"}}>
          <div style={S.label}>Risiko pro Trade (%)</div>
          <input style={S.input} type="number" step="0.1" value={settings.riskPct}
            onChange={e=>setSettings(s=>({...s,riskPct:parseFloat(e.target.value)||1}))}/>
        </div>
        <div style={{background:C.surface,borderRadius:"6px",padding:"10px"}}>
          {[
            ["Max. Risiko / Trade",`${((settings.depot*settings.riskPct)/100).toFixed(0)} €`,"green"],
            ["Max. Position (20%)",`${(settings.depot*0.2).toFixed(0)} €`,null],
            ["Notbremse / Woche",`-${(settings.depot*0.03).toFixed(0)} €`,"red"],
          ].map(([l,v,col])=>(
            <div key={l} style={S.row}>
              <span style={{color:C.muted,fontSize:"12px"}}>{l}</span>
              <span style={{fontFamily:C.mono,fontWeight:"600",color:col==="green"?C.accent:col==="red"?C.red:C.text}}>{v}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={S.card}>
        <div style={S.secTitle}>Aktive Filter</div>
        {["Nur Weinstein Stage 2","MA50 steigt","Kurs über MA50","Höhere Hochs bestätigt","ATR < 5%","Kurs > 10 €","Max. 20% über MA50"].map(r=>(
          <div key={r} style={{display:"flex",gap:"8px",padding:"4px 0",fontSize:"12px"}}>
            <span style={{color:C.accent,fontFamily:C.mono}}>✓</span><span>{r}</span>
          </div>
        ))}
      </div>
      <div style={{fontSize:"11px",color:C.muted,background:C.surface,borderRadius:"8px",padding:"12px",lineHeight:"1.8"}}>
        <strong style={{color:C.yellow}}>⚠ Pflicht-Hinweise</strong><br/>
        • Kein automatischer Stop-Loss bei TR/Scalable<br/>
        • Gap-Risiko: Verlust kann 50 € übersteigen<br/>
        • Daten mit 1 Tag Verzögerung (Yahoo Finance)<br/>
        • Tägliche manuelle Überwachung erforderlich<br/>
        • Keine Anlageberatung
      </div>
    </div>
  );
}

// ── HAUPT-APP ─────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]=useState("scan");
  const [settings,setSettings]=useState({depot:5000,riskPct:1});
  return (
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"Inter,system-ui,sans-serif",fontSize:"14px",maxWidth:"480px",margin:"0 auto"}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"14px 16px 10px",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}}>
          <div style={{fontFamily:C.mono,fontSize:"15px",fontWeight:"700",color:C.accent,letterSpacing:"0.08em"}}>SWING · SCAN</div>
          <div style={{fontFamily:C.mono,fontSize:"9px",color:C.muted,background:C.card,padding:"3px 8px",borderRadius:"999px",border:`1px solid ${C.border}`}}>EOD · {VOLL.length} TITEL</div>
        </div>
        <div style={{display:"flex",gap:"4px"}}>
          {[["scan","📊 Scan"],["check","🔍 Prüfen"],["settings","⚙ Einstellungen"]].map(([id,label])=>(
            <button key={id} style={{flex:1,padding:"7px 2px",background:tab===id?C.accent:"transparent",color:tab===id?C.bg:C.muted,border:`1px solid ${tab===id?C.accent:C.border}`,borderRadius:"6px",cursor:"pointer",fontSize:"11px",fontWeight:tab===id?"700":"400",textAlign:"center"}} onClick={()=>setTab(id)}>{label}</button>
          ))}
        </div>
      </div>
      <div style={{padding:"14px"}}>
        {tab==="scan"    &&<ScannerTab settings={settings}/>}
        {tab==="check"   &&<CheckerTab settings={settings}/>}
        {tab==="settings"&&<SettingsTab settings={settings} setSettings={setSettings}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
